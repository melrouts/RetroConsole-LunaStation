<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
<rect width="1800" height="1280" fill="#fff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#222}
.title{font-size:30px;font-weight:700;fill:#111}
.sub{font-size:16px;fill:#444}
.label{font-size:15px}
.small{font-size:13px}
.bold{font-weight:700}
.pad{fill:#fff;stroke:#c39a2f;stroke-width:3}
.used{stroke-width:5}
</style>
<text x="40" y="46" class="title">ESP32 MiniKit — контроллер с четырьмя кнопками</text>
<text x="40" y="82" class="sub">Вид сверху, со стороны компонентов. Антенна сверху, USB снизу; контакты показаны в этом же ракурсе.</text>
<text x="40" y="108" class="sub">Подключайте при отключённом питании. Кружки с цифрами — номер площадки от края с антенной.</text>

<!-- Dashed supply runs are routed on the board underside and hidden beneath its body. -->
<path d="M600 1088 H650 V950 H1715 V660 H1260 V636" fill="none" stroke="#d0312d" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M600 1124 H650 V990 H700 V270 H1300 V300" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="10 8"/>

<!-- Top-side board view: the pin rows are mirrored from the solder-side drawing. -->
<rect x="760" y="210" width="440" height="700" rx="18" fill="#e6f0fb" stroke="#2b6cb0" stroke-width="3"/>
<path d="M800 210 L850 160 H1110 L1160 210" fill="#d7e8f8" stroke="#2b6cb0" stroke-width="3"/>
<text x="980" y="184" text-anchor="middle" class="label bold">антенна</text>
<rect x="850" y="270" width="260" height="260" rx="8" fill="none" stroke="#9db7d6" stroke-dasharray="8 5" stroke-width="2"/>
<text x="980" y="390" text-anchor="middle" class="label" fill="#6f8db3">ESP-WROOM-32</text>
<text x="980" y="416" text-anchor="middle" class="small" fill="#6f8db3">виден сверху</text>
<rect x="905" y="880" width="150" height="30" fill="#d8dadd" stroke="#777" stroke-width="2"/>
<text x="980" y="932" text-anchor="middle" class="small">micro-USB</text>
<rect x="730" y="838" width="26" height="54" rx="4" fill="#f7f7f7" stroke="#777" stroke-width="2"/>
<text x="716" y="868" text-anchor="end" class="small">RST</text>
<text x="980" y="970" text-anchor="middle" class="small bold">плата ESP32 MiniKit · вид со стороны компонентов</text>

<!-- Left header rows; unneeded pins are intentionally not labeled. -->
<text x="738" y="232" text-anchor="end" class="small">другие площадки</text>
<text x="1218" y="252" text-anchor="end" class="small">внутренний ряд</text>
<text x="1324" y="252" class="small">внешний ряд</text>
<circle cx="740" cy="540" r="13" class="pad used" stroke="#008b8b"/>
<text x="740" y="545" text-anchor="middle" class="small">6</text>
<text x="720" y="520" text-anchor="end" class="label bold" fill="#008b8b" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO23</text>

<!-- Relevant right-side pads in the top-side view. -->
<g class="small" text-anchor="middle">
  <circle cx="1300" cy="300" r="13" class="pad used"/><text x="1300" y="305">1</text>
  <circle cx="1300" cy="348" r="13" class="pad used" stroke="#1f5fd0"/><text x="1300" y="353">2</text>
  <circle cx="1300" cy="396" r="13" class="pad used" stroke="#169443"/><text x="1300" y="401">3</text>
  <circle cx="1300" cy="444" r="13" class="pad used" stroke="#d9730d"/><text x="1300" y="449">4</text>
  <circle cx="1300" cy="492" r="13" class="pad"/><text x="1300" y="497">5</text>
  <circle cx="1300" cy="540" r="13" class="pad used" stroke="#7b3fb5"/><text x="1300" y="545">6</text>
  <circle cx="1300" cy="588" r="13" class="pad"/><text x="1300" y="593">7</text>
  <circle cx="1300" cy="636" r="13" class="pad"/><text x="1300" y="641">8</text>
  <circle cx="1260" cy="300" r="13" class="pad"/><text x="1260" y="305">1</text>
  <circle cx="1260" cy="348" r="13" class="pad"/><text x="1260" y="353">2</text>
  <circle cx="1260" cy="396" r="13" class="pad"/><text x="1260" y="401">3</text>
  <circle cx="1260" cy="444" r="13" class="pad"/><text x="1260" y="449">4</text>
  <circle cx="1260" cy="492" r="13" class="pad"/><text x="1260" y="497">5</text>
  <circle cx="1260" cy="540" r="13" class="pad"/><text x="1260" y="545">6</text>
  <circle cx="1260" cy="588" r="13" class="pad"/><text x="1260" y="593">7</text>
  <circle cx="1260" cy="636" r="13" class="pad used" stroke="#d0312d"/><text x="1260" y="641">8</text>
</g>
<text x="1324" y="286" class="label bold" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">GND</text>
<text x="1324" y="334" class="label bold" fill="#1f5fd0" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO27</text>
<text x="1324" y="382" class="label bold" fill="#169443" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO25</text>
<text x="1324" y="430" class="label bold" fill="#d9730d" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO32</text>
<text x="1324" y="478" class="label" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">TDI / GPIO12 — пропустить</text>
<text x="1324" y="526" class="label bold" fill="#7b3fb5" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO4</text>
<text x="1324" y="622" class="label bold" fill="#d0312d" stroke="#e6f0fb" stroke-width="4" paint-order="stroke">IO2 — не подключать</text>
<text x="1228" y="615" text-anchor="end" class="label bold" fill="#d0312d">VCC / 5V</text>

<!-- Button wiring. Every switch is normally open and connects its input to ground. -->
<text x="1460" y="184" text-anchor="middle" class="label bold">КНОПКИ</text>
<text x="1460" y="208" text-anchor="middle" class="small">тактовые, без фиксации</text>
<path d="M1300 300 H1580 V560" fill="none" stroke="#111" stroke-width="5"/>
<path d="M1548 348 H1580 M1548 396 H1580 M1548 444 H1580 M1548 540 H1580" fill="none" stroke="#111" stroke-width="4"/>
<path d="M1300 348 H1450" fill="none" stroke="#1f5fd0" stroke-width="4"/>
<path d="M1300 396 H1450" fill="none" stroke="#169443" stroke-width="4"/>
<path d="M1300 444 H1450" fill="none" stroke="#d9730d" stroke-width="4"/>
<path d="M1300 540 H1450" fill="none" stroke="#7b3fb5" stroke-width="4"/>
<g text-anchor="middle" font-size="13">
  <circle cx="1300" cy="300" r="13" fill="#fff" stroke="#111" stroke-width="5"/><text x="1300" y="305">1</text>
  <circle cx="1300" cy="348" r="13" fill="#fff" stroke="#1f5fd0" stroke-width="5"/><text x="1300" y="353">2</text>
  <circle cx="1300" cy="396" r="13" fill="#fff" stroke="#169443" stroke-width="5"/><text x="1300" y="401">3</text>
  <circle cx="1300" cy="444" r="13" fill="#fff" stroke="#d9730d" stroke-width="5"/><text x="1300" y="449">4</text>
  <circle cx="1300" cy="492" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1300" y="497">5</text>
  <circle cx="1300" cy="540" r="13" fill="#fff" stroke="#7b3fb5" stroke-width="5"/><text x="1300" y="545">6</text>
  <circle cx="1300" cy="588" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1300" y="593">7</text>
  <circle cx="1300" cy="636" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1300" y="641">8</text>
  <circle cx="1260" cy="300" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="305">1</text>
  <circle cx="1260" cy="348" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="353">2</text>
  <circle cx="1260" cy="396" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="401">3</text>
  <circle cx="1260" cy="444" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="449">4</text>
  <circle cx="1260" cy="492" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="497">5</text>
  <circle cx="1260" cy="540" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="545">6</text>
  <circle cx="1260" cy="588" r="13" fill="#fff" stroke="#c39a2f" stroke-width="3"/><text x="1260" y="593">7</text>
  <circle cx="1260" cy="636" r="13" fill="#fff" stroke="#d0312d" stroke-width="5"/><text x="1260" y="641">8</text>
</g>
<g>
  <rect x="1450" y="326" width="98" height="44" rx="7" fill="#e0e9fb" stroke="#1f5fd0" stroke-width="3"/>
  <circle cx="1499" cy="348" r="13" fill="#1f5fd0"/>
  <text x="1600" y="353" class="label bold" fill="#1f5fd0">LEFT</text>
  <rect x="1450" y="374" width="98" height="44" rx="7" fill="#dcf2e3" stroke="#169443" stroke-width="3"/>
  <circle cx="1499" cy="396" r="13" fill="#169443"/>
  <text x="1600" y="401" class="label bold" fill="#169443">THRUST / START</text>
  <rect x="1450" y="422" width="98" height="44" rx="7" fill="#fbe8d5" stroke="#d9730d" stroke-width="3"/>
  <circle cx="1499" cy="444" r="13" fill="#d9730d"/>
  <text x="1600" y="449" class="label bold" fill="#d9730d">RIGHT</text>
  <rect x="1450" y="518" width="98" height="44" rx="7" fill="#ece2f6" stroke="#7b3fb5" stroke-width="3"/>
  <circle cx="1499" cy="540" r="13" fill="#7b3fb5"/>
  <text x="1600" y="545" class="label bold" fill="#7b3fb5">MENU</text>
</g>
<text x="1460" y="608" text-anchor="middle" class="small">При нажатии GPIO замыкается на GND</text>

<!-- Matrix output: DIN is a 3.3 V data signal; power and ground share the controller rails. -->
<rect x="50" y="350" width="580" height="310" rx="14" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/>
<text x="78" y="384" class="label bold">ВЫХОД НА LED-МАТРИЦУ WS2812 / NeoPixel</text>
<text x="78" y="414" class="small">Разъём матрицы · вид на контакты</text>
<g fill="#e2bb34" stroke="#9e7d18" stroke-width="2">
  <circle cx="118" cy="464" r="12"/><circle cx="158" cy="464" r="12"/><circle cx="198" cy="464" r="12"/><circle cx="238" cy="464" r="12"/>
  <circle cx="118" cy="504" r="12"/><circle cx="158" cy="504" r="12"/><circle cx="198" cy="504" r="12"/><circle cx="238" cy="504" r="12"/>
  <circle cx="118" cy="544" r="12"/><circle cx="158" cy="544" r="12"/><circle cx="198" cy="544" r="12"/><circle cx="238" cy="544" r="12"/>
  <circle cx="118" cy="584" r="12"/><circle cx="158" cy="584" r="12"/><circle cx="198" cy="584" r="12"/><circle cx="238" cy="584" r="12"/>
</g>
<text x="178" y="624" text-anchor="middle" class="small">матрица 4×4</text>
<path d="M480 440 H540 M480 490 H540 M480 540 H540" fill="none" stroke="#888" stroke-width="4"/>
<circle cx="540" cy="440" r="10" fill="#fff" stroke="#d0312d" stroke-width="4"/>
<circle cx="540" cy="490" r="10" fill="#fff" stroke="#008b8b" stroke-width="4"/>
<circle cx="540" cy="540" r="10" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="468" y="445" text-anchor="end" class="label bold" fill="#d0312d">+5V</text>
<text x="468" y="495" text-anchor="end" class="label bold" fill="#008b8b">DIN</text>
<text x="468" y="545" text-anchor="end" class="label bold">GND</text>
<path d="M540 440 H665 V950 H650 V1088 H600" fill="none" stroke="#d0312d" stroke-width="4" stroke-dasharray="9 7"/>
<path d="M540 540 H690 V990 H650 V1124 H600" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="9 7"/>
<path d="M740 540 H620 V490 H540" fill="none" stroke="#008b8b" stroke-width="5"/>
<text x="78" y="642" class="small">GPIO23 → DIN · питание матрицы от той же линии 5 В; общий GND.</text>

<!-- Battery and regulated supply; the dashed run is routed on the board underside. -->
<rect x="70" y="1010" width="570" height="200" rx="14" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
<text x="95" y="1044" class="label bold">ПИТАНИЕ ОТ АККУМУЛЯТОРА</text>
<rect x="100" y="1070" width="160" height="72" rx="8" fill="#fff3dc" stroke="#c58b22" stroke-width="2"/>
<text x="180" y="1100" text-anchor="middle" class="label bold">аккумулятор</text>
<text x="180" y="1124" text-anchor="middle" class="small">Li-ion / LiPo</text>
<path d="M260 1088 H330 M260 1124 H330" stroke="#777" stroke-width="4"/>
<rect x="330" y="1070" width="270" height="72" rx="8" fill="#f2f7ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="465" y="1098" text-anchor="middle" class="label bold">повышающий преобразователь</text>
<text x="465" y="1124" text-anchor="middle" class="small">выход: стабилизированные 5 В</text>
<text x="95" y="1176" class="small" fill="#d0312d">+5 В преобразователя → VCC/5V ESP32; GND → GND.</text>

<rect x="700" y="1010" width="720" height="200" rx="14" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/>
<text x="730" y="1045" class="label bold">Важно по питанию</text>
<text x="730" y="1080" class="label">Не подключайте аккумулятор напрямую к VCC.</text>
<text x="730" y="1110" class="label">VCC/5V — вход платы; подавайте только стабилизированные 5 В.</text>
<text x="730" y="1140" class="label">Общая земля: GND аккумулятора, преобразователя и ESP32.</text>
<text x="730" y="1170" class="small">Преобразователь должен выдерживать пиковый ток ESP32 и матрицы WS2812.</text>
<text x="730" y="1196" class="small">DIN — сигнал 3,3 В; для надёжной работы 5-вольтовой матрицы рекомендуется буфер 74AHCT125.</text>

<rect x="70" y="1230" width="1660" height="36" rx="8" fill="#fff7e6" stroke="#e0c782"/>
<text x="90" y="1254" class="small">
  Кнопки: LEFT — GPIO27 (внешний ряд, 2-й пад); THRUST/START — GPIO25 (3-й); RIGHT — GPIO32 (4-й); MENU — GPIO4 (6-й); общий GND — 1-й пад.
</text>
</svg>
